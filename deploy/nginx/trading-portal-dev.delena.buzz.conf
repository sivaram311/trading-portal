# trading-portal-dev.delena.buzz → DEV API :3340 + UI static + css-next DEV :4910
# Cloudflare Flexible SSL → origin :80. Prefer subdomain over raw IP.

server {
    listen       80;
    server_name  trading-portal-dev.delena.buzz;

    access_log  logs/trading-portal-dev.delena.buzz.access.log;
    error_log   logs/trading-portal-dev.delena.buzz.error.log;

    location /api/ {
        proxy_pass         http://127.0.0.1:3340/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:4910/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    location /.well-known/ {
        proxy_pass         http://127.0.0.1:4910/.well-known/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # Angular 18 application builder emits under /browser
    root   E:/MyWorkspace/trading-portal/frontend/dist/public-dev/browser;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
