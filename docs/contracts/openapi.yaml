openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: Trading Portal API (DEV contract)
  version: 0.3.2
  description: |
    Contract-first specification for the Trading Portal backend (Spring Boot 3.3).

    **Live:** `v0.3.2` — paper confluence + deep-algo engines + ops/backtest/P5 gate endpoints.
    See `docs/OPS.md` for the full route table; P5 micro-live is coded but fail-closed on F/G.

    Scope: XAUUSD only. Field names aligned with theory/algorithms docs (snake_case JSON).
  contact:
    name: Trading Portal crew
    url: https://github.com/
  license:
    name: Proprietary — internal use only
servers:
  - url: http://localhost:3340
    description: >-
      DEV API port, reserved (status `reserved`, not yet `active`) in
      `E:\MyAgent\workflow\ports\REGISTRY.md` by the architect hire per
      `agents/pre-work/02-architecture.md` §3. This contract does not itself bind the port or
      change the ports/DB/CSS registries.

tags:
  - name: health
  - name: market-data
  - name: engines
  - name: confluence
  - name: paper-trading
  - name: style
  - name: analytics
  - name: ops
  - name: backtest
  - name: live
  - name: style

security:
  - bearerAuth: []

paths:
  /api/style:
    get:
      tags: [style]
      summary: Get the active paper-trading style and available profiles
      description: >-
        Returns the runtime style selection and its effective profile. Style selection affects
        paper-path engine thresholds and lifecycle hints only; it neither enables nor submits
        live trading.
      operationId: getTradingStyle
      responses:
        "200":
          description: Active style and all selectable profile summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [style]
      summary: Change the active paper-trading style at runtime
      description: >-
        Updates the in-memory style used by subsequent pipeline and paper-path evaluations; a
        process restart is not required. This endpoint does not alter live-execution settings.
      operationId: updateTradingStyle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleUpdateRequest"
      responses:
        "200":
          description: Updated active style and profile summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/analytics/summary:
    get:
      tags: [analytics]
      summary: Summarize closed paper-trade performance
      description: >-
        Paper-first performance metrics (expectancy, win rate, avg R) derived from closed
        `paper_journal` rows. Fails soft: returns zeroed/null metrics (never 4xx/5xx) when no
        eligible closed trades exist yet.
      operationId: getAnalyticsSummary
      responses:
        "200":
          description: Aggregate closed-trade statistics, with optional mode/killzone group hints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/analytics/by-session:
    get:
      tags: [analytics]
      summary: Break down closed paper-trade performance by session
      description: >-
        Groups closed paper trades by ICT killzone (LONDON_OPEN/NY_OPEN/NY_AFTERNOON) when any
        closed trade carries one, otherwise falls back to an NY-local hour-bucket label. An empty
        `sessions` array is returned when there are no closed trades — never an error.
      operationId: getAnalyticsBySession
      responses:
        "200":
          description: Per-session or hour-bucket closed-trade statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsBySessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/health:
    get:
      tags: [health]
      summary: Liveness / readiness check
      description: >-
        The only unauthenticated endpoint. Must report degraded (not fake-green) if MT5 ingest
        or `ny_time` enrichment is stale, per AUTOMATION-PIPELINE.md "MT5 terminal dependency" risk.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: Service is up (status may still be `degraded`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/health/ny-time:
    get:
      tags: [health]
      summary: ny_time correctness self-check
      description: >-
        Per `agents/pre-work/02-architecture.md` §7. Verifies the server's America/New_York
        conversion (including the DST transition case) — a mandatory MVP gate, not optional
        diagnostics. Unauthenticated for the same reason as /api/health (must be checkable even
        when CSS/JWKS is degraded).
      security: []
      operationId: getNyTimeHealth
      responses:
        "200":
          description: ny_time conversion is correct.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyTimeHealthResponse"
        "500":
          description: ny_time conversion failed a self-check (e.g. DST edge case) — treat as a hard fail, never a silent fallback to UTC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyTimeHealthResponse"

  /api/market/xauusd/ohlc:
    get:
      tags: [market-data]
      summary: Query OHLC bars for XAUUSD
      operationId: getXauusdOhlc
      parameters:
        - name: tf
          in: query
          required: true
          description: Timeframe.
          schema:
            type: string
            enum: [M1, M5, M15, H1, H4, D1]
        - name: from
          in: query
          required: true
          description: Inclusive range start (UTC instant).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: Inclusive range end (UTC instant).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Bars ordered ascending by `ts`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/ohlc-bar.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/engines/ict/snapshot:
    get:
      tags: [engines]
      summary: Latest (or as-of) ICT engine snapshot
      operationId: getIctSnapshot
      parameters:
        - name: asof
          in: query
          required: false
          description: Evaluation instant; defaults to latest closed bar when omitted.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Snapshot computed for the requested (or latest) instant.
          content:
            application/json:
              schema:
                $ref: "./schemas/ict-snapshot.json"
        "204":
          description: No snapshot available yet (e.g. cold start / DATA_GAP upstream).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/engines/gann/snapshot:
    get:
      tags: [engines]
      summary: Latest (or as-of) Gann engine snapshot
      operationId: getGannSnapshot
      parameters:
        - name: asof
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: pivot_source
          in: query
          required: false
          description: Defaults to NY_OPEN per GANN-CYCLE-ENGINE.md §2.
          schema:
            type: string
            enum: [NY_OPEN, LONDON_OPEN, PDH, PDL, PREV_CLOSE, NY_HIGH, NY_LOW]
      responses:
        "200":
          description: Snapshot computed for the requested (or latest) instant.
          content:
            application/json:
              schema:
                $ref: "./schemas/gann-snapshot.json"
        "204":
          description: No snapshot available yet.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/confluence/decision:
    get:
      tags: [confluence]
      summary: Latest confluence decision
      description: >-
        Returns the most recent ConfluenceDecision (mode may be NONE / grade F — that is a valid,
        non-empty response representing a fail-closed NO_TRADE state).
      operationId: getLatestConfluenceDecision
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "./schemas/confluence-decision.json"
        "204":
          description: No decision computed yet (engines cold / no bars).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/paper/confirm:
    post:
      tags: [paper-trading]
      summary: Operator confirms a decision, opening a paper position
      description: >-
        MVP is confirm-always (auto paper fill feature flag OFF) — this is the only way a
        PAPER_OPEN row is created. The server re-runs / re-checks the RiskVerdict for the
        decision before opening; a prior risk deny or CONFLICT/grade-F decision must be rejected
        here even if the client attempts to confirm it (Q1 gate: "CONFLICT / risk deny never
        creates paper entries").
      operationId: confirmPaperDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "200":
          description: Paper position opened (or entry recorded as ALERTED->PAPER_OPEN).
          content:
            application/json:
              schema:
                $ref: "./schemas/paper-journal-entry.json"
        "404":
          description: decision_id not found.
        "409":
          description: >-
            Decision is not confirmable (already actioned, risk denies, automation=deny,
            or mode=NONE/grade=F).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/paper/dismiss:
    post:
      tags: [paper-trading]
      summary: Operator dismisses a decision without opening a paper position
      operationId: dismissPaperDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissRequest"
      responses:
        "200":
          description: Journal row recorded with status DISMISSED.
          content:
            application/json:
              schema:
                $ref: "./schemas/paper-journal-entry.json"
        "404":
          description: decision_id not found.
        "409":
          description: Decision already actioned (confirmed or previously dismissed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/paper/close:
    post:
      tags: [paper-trading]
      summary: Close an open/partial paper position (PositionManager MANUAL/exit)
      operationId: closePaperPosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseRequest"
      responses:
        "200":
          description: Paper position closed (PAPER_CLOSED) with exit_reason / r_multiple / mfe_r / mae_r.
          content:
            application/json:
              schema:
                $ref: "./schemas/paper-journal-entry.json"
        "404":
          description: decision_id not found.
        "409":
          description: Not an open paper position (status not PAPER_OPEN/PARTIAL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/paper/journal:
    get:
      tags: [paper-trading]
      summary: List paper journal entries
      operationId: listPaperJournal
      parameters:
        - name: grade
          in: query
          required: false
          schema:
            type: string
            enum: ["A+", "A", "B", "C", "F"]
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [R, C, T, NONE]
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [long, short, flat]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DETECTED, SCORED, RISK_CHECKED, REJECTED, ALERTED, DISMISSED, PAPER_OPEN, PAPER_CLOSED]
        - name: session_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/ops/status:
    get:
      tags: [ops]
      summary: Fleet observability + feature inventory
      operationId: getOpsStatus
      responses:
        "200":
          description: soak, OHLC freshness, ingest probe, live guard, trading_style, features map
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/backtest/capabilities:
    get:
      tags: [backtest]
      summary: Backtest surface metadata (paper-only)
      operationId: getBacktestCapabilities
      responses:
        "200":
          description: styles, m15 bar count, flags for WF/MC
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/backtest/run:
    post:
      tags: [backtest]
      summary: Run bar-by-bar backtest on stored OHLC
      operationId: runBacktest
      parameters:
        - name: maxBars
          in: query
          schema: { type: integer }
        - name: style
          in: query
          schema: { type: string, enum: [SCALP, DAY, POSITIONAL] }
        - name: walkForward
          in: query
          schema: { type: boolean, default: false }
        - name: monteCarlo
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: metrics + trades_csv
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: insufficient OHLC bars

  /api/style:
    get:
      tags: [style]
      summary: Current trading style + all preset profiles
      description: >-
        Reads the live `trading.style` value (default from `application.properties`, or a prior
        runtime override via PUT). Paper-only — affects engine thresholds, not live execution.
      operationId: getStyle
      responses:
        "200":
          description: Active style + key fields for SCALP/DAY/POSITIONAL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [style]
      summary: Override the active trading style at runtime (no restart)
      description: >-
        Updates `TradingProperties.style` in place (thread-safe volatile field + synchronized
        setter). Picked up by the very next pipeline recompute tick, since `PipelineService`
        re-reads `props.getStyle()` on every run rather than caching it at startup.
      operationId: setStyle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleUpdateRequest"
      responses:
        "200":
          description: Style updated; response mirrors GET /api/style with the new active style.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleStatusResponse"
        "400":
          description: Missing/invalid style (must be SCALP|DAY|POSITIONAL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/live/gate:
    get:
      tags: [live]
      summary: P5 live execution gate verdict
      operationId: getLiveGate
      responses:
        "200":
          description: ok/deny_reason/kill_switch_engaged
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer JWT issued by Centralized Security System (CSS) DEV IdP (:9000). API validates
        the token signature via CSS JWKS and checks audience/client match against
        `clientId=trading-portal` (per GROK-DECISION-001 auth decision). Required on every
        endpoint except /api/health.

  responses:
    BadRequest:
      description: Invalid query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing/invalid/expired bearer token, or audience/client mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
        details:
          type: object

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, ts]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        ts:
          type: string
          format: date-time
        ny_time:
          type: string
          format: date-time
          description: Server-computed America/New_York instant, for the mandatory ny_time correctness tests.
        checks:
          type: object
          additionalProperties: false
          properties:
            db:
              type: boolean
            ingest:
              type: boolean
              description: MT5 ingest freshness check.
            mt5:
              type: boolean

    NyTimeHealthResponse:
      type: object
      additionalProperties: false
      required: [ok, utc_now, ny_time_now, checks]
      properties:
        ok:
          type: boolean
        utc_now:
          type: string
          format: date-time
        ny_time_now:
          type: string
          format: date-time
        checks:
          type: array
          description: Individual self-check cases, including at least one DST-transition fixture.
          items:
            type: object
            additionalProperties: false
            required: [name, pass]
            properties:
              name:
                type: string
                description: e.g. "dst_spring_forward_2026", "dst_fall_back_2026", "offset_utc_minus_4", "offset_utc_minus_5"
              pass:
                type: boolean
              detail:
                type: string

    ConfirmRequest:
      type: object
      additionalProperties: false
      required: [decision_id]
      properties:
        decision_id:
          type: string
        note:
          type: string

    DismissRequest:
      type: object
      additionalProperties: false
      required: [decision_id]
      properties:
        decision_id:
          type: string
        reason:
          type: string

    CloseRequest:
      type: object
      additionalProperties: false
      required: [decision_id]
      properties:
        decision_id:
          type: string
        exit_reason:
          type: string
          description: MANUAL | STOP | T1 | T2 | TIME | STRUCTURE_FLIP | BE_STOP | NEWS
        exit_price:
          type: number
          format: double

    StyleUpdateRequest:
      type: object
      additionalProperties: false
      required: [style]
      properties:
        style:
          type: string
          enum: [SCALP, DAY, POSITIONAL]

    StyleProfileSummary:
      type: object
      additionalProperties: false
      required:
        - style
        - risk_pct
        - max_legs
        - max_spread_pts
        - max_hold
        - require_killzone
        - be_trigger_r
        - scale_out_pct
      properties:
        style:
          type: string
          enum: [SCALP, DAY, POSITIONAL]
        risk_pct:
          type: number
          format: double
          description: Profile metadata only — paper RiskGate still enforces 0.5%/max-1-open.
        max_legs:
          type: integer
        max_spread_pts:
          type: number
          format: double
        max_hold:
          type: string
          description: ISO-8601 duration (e.g. `PT45M`, `PT8H`, `PT120H`).
        require_killzone:
          type: boolean
        be_trigger_r:
          type: number
          format: double
        scale_out_pct:
          type: number
          format: double

    StyleStatusResponse:
      type: object
      additionalProperties: false
      required: [style, max_legs, risk_pct, profiles]
      properties:
        style:
          type: string
          enum: [SCALP, DAY, POSITIONAL]
          description: Currently active style (post-update value on PUT responses).
        max_legs:
          type: integer
        risk_pct:
          type: number
          format: double
        profiles:
          type: array
          description: Key fields for all three presets (SCALP, DAY, POSITIONAL), regardless of which is active.
          items:
            $ref: "#/components/schemas/StyleProfileSummary"

    JournalListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "./schemas/paper-journal-entry.json"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        offset:
          type: integer

    StyleUpdateRequest:
      type: object
      additionalProperties: false
      required: [style]
      properties:
        style:
          type: string
          enum: [SCALP, DAY, POSITIONAL]

    StyleResponse:
      type: object
      additionalProperties: false
      required: [style, max_legs, risk_pct, profiles]
      properties:
        style:
          type: string
          enum: [SCALP, DAY, POSITIONAL]
        max_legs:
          type: integer
          minimum: 1
          description: Profile metadata; paper trading may enforce a stricter open-position limit.
        risk_pct:
          type: number
          minimum: 0
          description: Profile risk percentage metadata.
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/StyleProfile"

    StyleProfile:
      type: object
      additionalProperties: false
      required: [style, max_legs, risk_pct, require_killzone, be_trigger_r, scale_out_pct, max_spread_pts]
      properties:
        style:
          type: string
          enum: [SCALP, DAY, POSITIONAL]
        max_legs:
          type: integer
          minimum: 1
        risk_pct:
          type: number
          minimum: 0
        max_hold:
          type: string
          description: Maximum holding duration, serialized as an ISO-8601 duration when exposed.
        require_killzone:
          type: boolean
        be_trigger_r:
          type: number
          minimum: 0
        scale_out_pct:
          type: number
          minimum: 0
          maximum: 1
        max_spread_pts:
          type: number
          minimum: 0

    AnalyticsSummary:
      type: object
      additionalProperties: false
      description: >-
        Matches `frontend/src/app/core/models.ts` `AnalyticsSummary`. `profit_factor` /
        `avg_win_r` / `avg_loss_r` / `total_r` are `null` when `trade_count` is 0.
      required: [trade_count, win_rate, expectancy_r]
      properties:
        trade_count:
          type: integer
          minimum: 0
        win_rate:
          type: number
          minimum: 0
          maximum: 1
        expectancy_r:
          type: number
        profit_factor:
          type: number
          nullable: true
        avg_win_r:
          type: number
          nullable: true
        avg_loss_r:
          type: number
          nullable: true
          description: Negative-signed average losing R-multiple.
        total_r:
          type: number
          nullable: true
        as_of:
          type: string
          format: date-time
          description: Server instant the summary was computed.
        by_mode:
          type: object
          description: Optional group hints keyed by recorded confluence mode (R/C/T/NONE), when data exists.
          additionalProperties:
            $ref: "#/components/schemas/AnalyticsBreakdown"
        by_killzone:
          type: object
          description: >-
            Optional group hints keyed by ICT killzone (LONDON_OPEN/NY_OPEN/NY_AFTERNOON), when
            any closed trade has one.
          additionalProperties:
            $ref: "#/components/schemas/AnalyticsBreakdown"

    AnalyticsBySessionResponse:
      type: object
      additionalProperties: false
      description: Matches `frontend/src/app/core/models.ts` `AnalyticsBySessionResponse`.
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSession"

    AnalyticsSession:
      type: object
      additionalProperties: false
      required: [session, trade_count, win_rate, expectancy_r]
      properties:
        session:
          type: string
          description: Killzone label (LONDON_OPEN/NY_OPEN/NY_AFTERNOON/OUTSIDE_KILLZONE), or an "HH:00-HH:00" hour-bucket fallback.
        trade_count:
          type: integer
          minimum: 0
        win_rate:
          type: number
          minimum: 0
          maximum: 1
        expectancy_r:
          type: number

    AnalyticsBreakdown:
      type: object
      additionalProperties: false
      required: [trade_count, win_rate, expectancy_r]
      properties:
        trade_count:
          type: integer
          minimum: 0
        win_rate:
          type: number
